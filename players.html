<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MLBポストシーズン選手成績</title>
<meta name="description" content="MLBポストシーズン通算の打撃・投手成績ランキングと日本人選手の成績。1時間ごとに自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">

<div class="wrap">
  <nav class="sitenav" aria-label="サイト内"><a href="index.html">トップ</a><a href="results.html">試合結果</a><a href="players.html" aria-current="page">選手成績</a></nav>
  <header>
    <h1><small>MLBスコアボード</small>ポストシーズン選手成績</h1>

    スコア・個人成績・順位はMLB公式データをもとに1時間ごとに自動更新しています。試合終了から反映まで最大1時間ほどかかります。
