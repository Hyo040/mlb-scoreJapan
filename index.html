<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MLBスコアボード日本語版</title>
<meta name="description" content="MLBポストシーズンの試合結果・勝ち上がり・個人成績・順位表を日本語でまとめた非公式ファンサイト。1時間ごとに自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
</head><body>
<div class="wrap">
  <header>
    <h1><small>MAJOR LEAGUE BASEBALL POSTSEASON</small>MLBスコアボード</h1>
    <div class="stamp" id="stamp">読み込み中…</div>
  </header>

  <section aria-labelledby="h-next">
    <div class="sec-head"><h2 id="h-next">次の試合</h2><p>時刻はすべて日本時間</p></div>
    <div class="board" id="next"></div>
  </section>

  <section aria-labelledby="h-bracket">
    <div class="sec-head"><h2 id="h-bracket">ポストシーズン勝ち上がり</h2><p>右の数字は各シリーズの勝利数</p></div>
    <div class="bracket-scroll"><div class="bracket" id="bracket"></div></div>
  </section>

  <section aria-labelledby="h-results">
    <div class="sec-head"><h2 id="h-results">試合結果</h2><p>各試合の「詳細」から試合ページへ</p></div>
    <div class="results" id="results"></div>
  </section>

  <section aria-labelledby="h-stand">
    <div class="sec-head"><h2 id="h-stand">レギュラーシーズン最終順位</h2></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-al" aria-selected="true" data-lg="AL">ア・リーグ</button>
      <button role="tab" id="tab-nl" aria-selected="false" data-lg="NL">ナ・リーグ</button>
    </div>
    <div class="divs" id="divs"></div>
    <div class="legend"><span><span class="mark d">地区</span> 地区優勝</span><span><span class="mark wc">WC</span> ワイルドカード</span><span>灰色はポストシーズン進出ならず</span></div>
  </section>

  <footer>
    このサイトはファンが作成した非公式のまとめページで、MLBおよび各球団とは関係ありません。<br>
    スコア・個人成績・順位はMLB公式データをもとに1時間ごとに自動更新しています。試合終了から反映まで最大1時間ほどかかります。
  </footer>
</div>
<script src="app.js"></script>
<script>MLB.start('index');</script>
</body></html>
